services:
  wso2-fhir-server:
    image: ghcr.io/wso2/fhir-server:v2.2.0
    environment:
      DB_HOST: postgresql-server
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-postgres}
      FHIR_CREATE_TABLES: "true"
      SERVER_PORT: "8080"
      BASE_URL: http://localhost:8080/fhir/r4
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgresql-server
    restart: on-failure
    networks:
      - wso2-fhir_network
  postgresql-server:
    image: docker.io/postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports: []
    networks:
      - wso2-fhir_network
  fhir-mcp-server:
    build: .
    image: docker.io/wso2/fhir-mcp-server:latest
    container_name: fhir-mcp-server
    environment:
      FHIR_SERVER_BASE_URL: http://wso2-fhir-server:8080/fhir/r4
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: "8000"
      FHIR_MCP_REQUEST_TIMEOUT: "30"
      FHIR_SERVER_DISABLE_AUTHORIZATION: True
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - wso2-fhir-server
    networks:
      - wso2-fhir_network
networks:
  wso2-fhir_network:
    name: wso2-fhir_network
