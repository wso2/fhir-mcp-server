# Separate project name so this stack does not replace the HAPI stack in docker-compose.hapi-fhir-server.yml.
name: fhir-mcp-wso2

services:
  wso2-fhir-server:
    image: ghcr.io/wso2/fhir-server:v2.2.0
    environment:
      DATABASE_URL: postgres://postgres:password@postgresql-server:5432/postgres?sslmode=disable&pool_max_conns=20
      FHIR_CREATE_TABLES: "true"
      SERVER_PORT: "8080"
      BASE_URL: http://localhost:8080/fhir/r4
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgresql-server
    restart: on-failure
    networks:
      - wso2-fhir_network
  postgresql-server:
    image: docker.io/postgres:17
    environment:
      - POSTGRES_PASSWORD=password
    ports: []
    networks:
      - wso2-fhir_network
  fhir-mcp-server:
    build: .
    image: docker.io/wso2/fhir-mcp-server:latest
    container_name: fhir-mcp-server-wso2
    environment:
      FHIR_SERVER_BASE_URL: http://wso2-fhir-server:8080/fhir/r4
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: "8000"
      FHIR_MCP_REQUEST_TIMEOUT: "30"
      FHIR_SERVER_DISABLE_AUTHORIZATION: True
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - wso2-fhir-server
    networks:
      - wso2-fhir_network
networks:
  wso2-fhir_network:
    name: wso2-fhir_network
